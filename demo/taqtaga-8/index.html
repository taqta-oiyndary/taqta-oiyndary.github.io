<style data-k>
:root{--bg:#0f1729;--panel:#18243f;--panel2:#22314f;--text:#eef2ff;--muted:#9fb0cc;--line:#33466e;--top:#0b1222;--chip:#1e3a5f;
 --p1:#3b82f6;--p2:#f59e0b;--p3:#10b981;--ok:#16a34a;--bad:#dc2626;--warn:#f87171;--offBg:#3f1d1d;--offTx:#fca5a5;--own:#f5b942;--ownTx:#3b2606}
body.light{--bg:#eef2f7;--panel:#ffffff;--panel2:#e3e9f3;--text:#0f172a;--muted:#55657e;--line:#c3cede;--top:#dbe3ee;--chip:#dbe6f5;
 --p1:#1d4ed8;--p2:#c2410c;--p3:#047857;--warn:#dc2626;--offBg:#fee2e2;--offTx:#b91c1c;--own:#f5b942;--ownTx:#3b2606}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button svg{pointer-events:none}
input,select,textarea{font:inherit;color:#0f172a;background:#fff;user-select:text;-webkit-user-select:text}
#app{position:relative;height:100vh;height:var(--appH,100vh);display:flex;flex-direction:column}
.hint{color:var(--muted);font-size:clamp(13px,1.05vw,18px);line-height:1.5}
/* top bar: left | centre | right — the centre column is exactly the middle of the screen */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:1.2vw;padding:.9vh 1.4vw;background:var(--top);min-height:7vh}
#tL{min-width:0;font-size:clamp(14px,1.35vw,24px);color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tC{display:flex;justify-content:center;min-width:0}
#tR{display:flex;justify-content:flex-end;align-items:center;gap:.8vw;min-width:0}
#timer{font-size:clamp(30px,4.4vw,80px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1}
#timer.warn{color:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
#owner{display:block;background:var(--own);color:var(--ownTx);font-weight:800;font-size:clamp(14px,1.45vw,26px);padding:.3em 1em;border-radius:999px;white-space:nowrap;overflow:hidden;max-width:70vw;line-height:1.25;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#owner b{font-weight:600}#owner.np b{display:none}
#owner.wrap{white-space:normal;text-align:center;line-height:1.15;border-radius:12px;padding:.25em .7em}
.flag{flex:none;width:clamp(36px,3.2vw,60px);height:clamp(36px,3.2vw,60px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3a6,#e0402f 45%,#8e1b10);border:3px solid #f5b942;color:#fff;display:grid;place-items:center}
.flag svg{width:55%;height:55%}
.hide{display:none!important}
/* note at the bottom-left (bottom centre and right are the Promethean menu and window buttons) */
#foot{align-self:flex-start;margin:0 0 .6vh 1.2vw;max-width:58vw;font-size:clamp(11px,.85vw,15px);line-height:1.3;color:var(--ownTx);background:var(--own);padding:.25em .8em;border-radius:8px;font-weight:700}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
/* ---------- setup ---------- */
#setup{align-items:center;justify-content:center;gap:1.8vh;padding:1.5vh 3vw;text-align:center;overflow:auto}
#setup h1{font-size:clamp(26px,3vw,54px)}
.row{display:flex;gap:1vw;flex-wrap:wrap;justify-content:center;align-items:center}
.seg{display:inline-flex;background:var(--panel2);border-radius:14px;padding:4px;gap:4px}
.seg button{background:transparent;padding:.7vh 1.4vw;border-radius:10px;font-weight:800;font-size:clamp(15px,1.3vw,24px);color:var(--muted)}
.seg button.on{background:#2563eb;color:#fff}
.pick{display:flex;gap:1vw;width:100%;max-width:1500px;justify-content:center;flex-wrap:wrap}
.pick select{padding:1vh .8vw;border-radius:12px;border:2px solid var(--line);font-size:clamp(15px,1.3vw,24px);max-width:44vw}
.pbtn{padding:1vh 1.2vw;border-radius:12px;border:2px solid #2563eb;background:var(--panel);font-size:clamp(15px,1.3vw,24px);font-weight:800;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.names{display:flex;gap:1.5vw;width:100%;max-width:1850px}
.names label{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6vh;font-size:clamp(15px,1.4vw,24px);font-weight:700}
.slot{display:flex;gap:.5vw}
.slot input{flex:1;min-width:0;padding:1.1vh .4vw;border-radius:12px;border:4px solid var(--c);font-size:clamp(16px,1.5vw,30px);text-align:center;font-weight:700;cursor:pointer}
.slot .x{flex:none;width:3.2em;border-radius:12px;background:#b91c1c;color:#fff;font-size:clamp(14px,1.2vw,22px)}
.slot input.spin{color:#64748b}
.slot input.hit{animation:hit .5s}
@keyframes hit{0%{transform:scale(1.12);background:#fde68a}100%{transform:scale(1)}}
.opts{display:flex;gap:1.4vw;flex-wrap:wrap;justify-content:center;font-size:clamp(15px,1.3vw,23px);align-items:center}
.opts select,.opts input{padding:.6vh .6vw;border-radius:10px;border:1px solid var(--line);font-size:inherit}
.opts input[type=number]{width:4.4em;text-align:center}
.big{background:#2563eb;color:#fff;padding:1.8vh 6vw;border-radius:18px;font-size:clamp(24px,2.8vw,50px);font-weight:800;box-shadow:0 6px 0 #1e40af}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #1e40af}
.big:disabled{opacity:.4}
.small{background:var(--panel2);padding:1vh 1.3vw;border-radius:12px;font-size:clamp(14px,1.15vw,20px)}
.small.pri{background:#2563eb;color:#fff}.small.red{background:#b91c1c;color:#fff}
/* ---------- game ---------- */
.cols{flex:1;display:flex;gap:1vw;padding:1vw;min-height:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);border-radius:18px;border-top:10px solid var(--c);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.head{display:flex;justify-content:space-between;align-items:center;padding:1.1vh 1.2vw;background:var(--panel2);font-size:clamp(18px,1.8vw,34px);font-weight:800;gap:1vw}
.head .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c)}
.head .pr{font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.bar{height:8px;background:var(--top)}.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
.body{flex:1;display:flex;flex-direction:column;padding:1.5vh 1.1vw;gap:1.3vh;min-height:0}
.qtype{font-size:clamp(13px,1.05vw,19px);color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.q{font-size:clamp(18px,1.75vw,34px);font-weight:700;line-height:1.25;flex:none}
.q .gap{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--c);margin:0 .15em}
.ans{flex:1;display:flex;flex-direction:column;gap:1.2vh;justify-content:flex-end;min-height:0}
.ans button{background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:1.3vh 1vw;font-size:clamp(16px,1.5vw,30px);text-align:left;line-height:1.2;flex:1;max-height:15vh;display:flex;align-items:center;gap:.8vw}
.ans button b{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--c);color:var(--bg);display:grid;place-items:center;font-size:.8em}
.ans.two{flex-direction:row}
.ans.two button{justify-content:center;text-align:center;font-size:clamp(18px,1.8vw,34px);font-weight:800;max-height:24vh}
.ans.tf button{white-space:nowrap}
.ans button.ok{background:var(--ok);border-color:#4ade80;color:#fff}
.ans button.bad{background:var(--bad);border-color:#f87171;color:#fff}
.done{flex:1;display:grid;place-items:center;text-align:center;font-size:clamp(22px,2.2vw,42px);font-weight:800;color:var(--c);padding:2vh}
.done small{display:block;font-size:.55em;color:var(--muted);font-weight:500;margin-top:1vh}
/* ---------- result ---------- */
#result{align-items:center;justify-content:center;gap:2.6vh;padding:2vh;overflow:auto}
#result h2{font-size:clamp(28px,3.4vw,60px)}
.podium{display:flex;gap:2vw;width:100%;max-width:1600px;justify-content:center}
.card{flex:1;background:var(--panel);border-radius:20px;border-top:12px solid var(--c);padding:2.6vh 1.5vw;text-align:center;display:flex;flex-direction:column;gap:1vh}
.card .medal{font-size:clamp(46px,5.5vw,100px);line-height:1}
.card .nm{font-size:clamp(20px,2.1vw,38px);font-weight:800}
.card .sc{font-size:clamp(40px,4.6vw,88px);font-weight:900;color:var(--c)}
.card .det{font-size:clamp(14px,1.2vw,22px);color:var(--muted)}
/* ---------- windows ---------- */
#ov .modal{position:fixed;inset:0;background:rgba(5,10,20,.7);display:none;align-items:center;justify-content:center;z-index:10}
#ov .modal.on{display:flex}
.box{background:var(--panel);border-radius:18px;padding:2.2vh 2vw;width:min(1300px,94vw);max-height:90vh;display:flex;flex-direction:column;gap:1.3vh}
.box h3{font-size:clamp(20px,1.8vw,32px)}
.box textarea{flex:1;border-radius:10px;padding:1vh 1vw;font-size:15px;font-family:Consolas,monospace;resize:none;border:1px solid var(--line);min-height:38vh}
.msg{font-size:clamp(14px,1.1vw,18px);min-height:1.4em;white-space:pre-line}
.msg.good{color:#22c55e}.msg.bad{color:#ef4444}
.grid{display:flex;flex-wrap:wrap;gap:1vh .6vw;overflow:auto;flex:1;align-content:flex-start;min-height:16vh}
.grid button{background:var(--chip);padding:1.3vh 1.1vw;border-radius:12px;font-size:clamp(15px,1.3vw,24px);border:3px solid transparent;text-align:left}
.grid button.off{background:var(--offBg);color:var(--offTx);text-decoration:line-through;border-color:#dc2626}
.grid button.pl{opacity:.5}.grid button:disabled{opacity:.2}
.grid button.sel{border-color:#2563eb;background:#2563eb;color:#fff}
.grid.paras button{width:calc(50% - .6vw);display:flex;gap:.8vw;align-items:baseline}
.grid.paras button b{flex:none;min-width:2.6em}
.grid.paras button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qlist{overflow:auto;flex:1;display:flex;flex-direction:column;gap:.8vh}
.qlist button{background:var(--chip);text-align:left;padding:1vh 1vw;border-radius:10px;font-size:clamp(14px,1.15vw,20px);border:3px solid transparent}
.qlist button.sel{border-color:#dc2626;background:var(--offBg);color:var(--offTx)}
.jr{overflow:auto;flex:1;min-height:26vh}
.jr table{width:100%;border-collapse:collapse;font-size:clamp(14px,1.15vw,21px)}
.jr td,.jr th{padding:.7vh .7vw;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.jr th{color:var(--muted);font-weight:600}.jr .tp{display:block;color:var(--muted);font-size:.78em}
#toast{position:fixed;left:50%;top:14vh;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 22px;border-radius:12px;font-weight:800;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;font-size:clamp(15px,1.3vw,22px)}
#toast.on{opacity:.95}
/* hover only for a real mouse (on a touch board it sticks) */
@media (hover:hover) and (pointer:fine){.small:hover,.pbtn:hover{filter:brightness(1.1)}}
/* phone upright: calm 'turn the phone' screen */
#narrow{display:none;position:fixed;inset:0;z-index:99;background:#054b54;background-image:radial-gradient(ellipse at 50% 30%,#10adbb 0%,#05707e 45%,#054b54 100%);color:#fff;align-items:center;justify-content:center;text-align:center;padding:6vw}
body.narrow #narrow{display:flex}
body.narrow #app,body.narrow #ov{visibility:hidden}
#narrow .nb{display:flex;flex-direction:column;align-items:center;gap:3vh;max-width:560px}
#narrow .nph{width:46px;height:78px;border:5px solid #f7c947;border-radius:10px;animation:nrot 2.4s ease-in-out infinite}
@keyframes nrot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
#narrow .nk{font-weight:900;font-size:clamp(18px,5.2vw,30px);line-height:1.3;color:#f7c947}
#narrow .nr{font-weight:800;font-size:clamp(15px,4.2vw,24px);line-height:1.3;opacity:.85}
@media (max-width:900px){#owner{font-size:14px}.top{padding:.6vh 1vw}#foot{font-size:10px;max-width:70vw}}
.ans.ord{flex-direction:column}
@media (max-height:520px){#result{justify-content:flex-start;gap:1.2vh}.card{padding:1vh 1vw;gap:.4vh}.card .medal{font-size:28px}.card .sc{font-size:28px}.card .nm{font-size:15px}#result h2{font-size:20px}.big{font-size:18px;padding:1vh 4vw}.q{font-size:15px}.ans button{font-size:14px;padding:.5vh .6vw}.qtype{font-size:11px}.head{font-size:15px}}

/* v2: compact dashboard; no scrolling on normal interactive boards */
#setup{justify-content:flex-start;gap:1.1vh;padding:1vh 2vw 1.2vh;text-align:left;overflow:auto}
.setup-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:1vw}
#setup h1{font-size:clamp(24px,2.3vw,42px)}
.setup-layout{width:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto auto;gap:1.2vh 1vw;flex:1;min-height:0}
.setup-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.5vh 1.2vw;display:flex;flex-direction:column;gap:1.3vh;min-width:0;justify-content:center}
.panel-label{font-weight:900;color:var(--muted);font-size:clamp(13px,1.05vw,19px);letter-spacing:.03em}
.material{grid-column:1;grid-row:1 / 3;justify-content:flex-start}
.players{grid-column:2;grid-row:1}
.settings{grid-column:2;grid-row:2}
#setup .pick{flex-direction:column;align-items:stretch;max-width:none;gap:1.2vh}
#setup .pick select,#setup .pbtn{width:100%;max-width:none;min-height:5.8vh}
#setup #paraBtn{min-height:10vh;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
#setup .names{gap:.65vw}
#setup .names label{font-size:clamp(13px,1.1vw,20px)}
#setup .slot{flex-direction:column;gap:.4vh}
#setup .slot input{width:100%;font-size:clamp(14px,1.2vw,22px);padding:.8vh .2vw}
#setup .slot .x{align-self:flex-end;width:2.4em;padding:.2vh}
#setup .opts{justify-content:flex-start;gap:.9vw;font-size:clamp(13px,1.08vw,19px)}
.setup-actions{width:100%;display:flex;align-items:center;gap:1vw;justify-content:space-between}
.setup-actions .big{padding:1.3vh 3.4vw;font-size:clamp(21px,2vw,36px);white-space:nowrap}
.setup-tools{display:flex;gap:.5vw;flex-wrap:wrap;justify-content:flex-end}
.setup-tools .small{padding:.7vh .7vw;font-size:clamp(12px,.95vw,17px)}
#setup .seg button{padding:.7vh .9vw;font-size:clamp(13px,1.05vw,19px)}
#mPara .box{width:min(1450px,96vw);height:min(88vh,900px);max-height:90vh}
.para-search{display:flex;gap:1vw;align-items:center}
.para-search input{flex:1;min-width:0;padding:1.3vh 1vw;border:2px solid var(--line);border-radius:12px;font-size:clamp(16px,1.35vw,24px)}
#paraCount{color:var(--muted);white-space:nowrap;font-size:clamp(13px,1vw,18px)}
#mPara .grid.paras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:.7vh .7vw;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:.3vh}
#mPara .grid.paras button{width:auto;min-width:0;min-height:6.2vh;align-items:center;line-height:1.25;padding:.8vh .8vw}
#mPara .grid.paras button span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#mPara .grid.paras button b{min-width:3em}
@media(max-width:1050px){.setup-layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.setup-tools .small{font-size:12px}#setup .names{flex-direction:column}#setup .slot{flex-direction:row}#setup .slot .x{align-self:stretch}}
@media(max-height:650px){#setup{gap:.6vh}.setup-panel{padding:.8vh 1vw;gap:.7vh}.setup-layout{gap:.7vh}.setup-actions .big{padding:.8vh 3vw}#setup #paraBtn{min-height:8vh}#setup .slot input{padding:.35vh}.setup-tools .small{padding:.4vh .6vw}}

/* Student picker: maximize readable names and touch targets */
#mPick .box{width:97vw;height:91vh;max-height:91vh;padding:2vh 2vw;gap:1vh}
#mPick h3{font-size:clamp(25px,2.7vw,48px);line-height:1.15}
#mPick .hint{font-size:clamp(15px,1.15vw,22px)}
.picker-search{display:flex;gap:1vw;align-items:center}
.picker-search input{flex:1;min-width:0;font-size:clamp(19px,1.6vw,30px);padding:1vh 1vw;border:2px solid var(--line);border-radius:12px}
#pkCount{font-size:clamp(16px,1.2vw,23px);color:var(--muted);white-space:nowrap}
#mPick #pkGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(7vh,auto);align-content:start;gap:1vh .8vw;overflow:auto;min-height:0;flex:1;padding:.5vh .3vw}
#mPick #pkGrid button{width:100%;min-width:0;min-height:7vh;text-align:center;overflow-wrap:anywhere;font-size:clamp(19px,1.5vw,29px);font-weight:750;line-height:1.2;padding:1vh .6vw;border-radius:14px}
#mPick #pkGrid button:disabled{opacity:.28}
#mPick .row{flex:none;gap:1vw;justify-content:center}
#mPick .row button{font-size:clamp(17px,1.3vw,25px);padding:1.1vh 1.5vw;min-height:5vh}
@media(max-width:1100px){#mPick #pkGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-height:600px){#mPick #pkGrid{grid-auto-rows:minmax(10vh,auto)}#mPick #pkGrid button{min-height:10vh}}
/* More space for lesson selection, narrower participant/settings column */
#setup .players .names{gap:.45vw}
#setup .players .slot input{min-width:0}
#setup .players .setup-panel{min-width:0}

#setup .material{grid-column:1 / -1;grid-row:1;justify-content:center;gap:1vh}
#setup .material .pick{flex-direction:row;align-items:stretch;gap:1vw;max-width:none}

#setup .material #paraBtn{flex:1;min-width:0;min-height:7vh;max-height:12vh}
#setup .players{grid-column:1;grid-row:2;justify-content:flex-start}
#setup .settings{grid-column:2;grid-row:2;justify-content:flex-start}
#setup .players .names{gap:1vw;flex-direction:row}
#setup .players .slot{flex-direction:row;align-items:center;gap:.3vw}
#setup .players .slot .x{align-self:stretch}

@media(max-width:1050px){#setup .setup-layout{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}#setup .players .names{flex-direction:row}#setup .players .slot{flex-direction:column}#setup .players .slot .x{align-self:flex-end}}

/* v5: three full-width horizontal rows */
#setup .setup-layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.65fr);gap:.8vh;flex:1;min-height:0}
#setup .material{grid-column:1;grid-row:1;justify-content:center}
#setup .players{grid-column:1;grid-row:2;justify-content:center}
#setup .settings{grid-column:1;grid-row:3;justify-content:center}
#setup .material .pick{flex-direction:row;align-items:stretch}
#setup .material #bookSel{flex:0 0 35%;width:35%}
#setup .material #paraBtn{flex:1;min-width:0;min-height:6vh;max-height:11vh}
#setup .players .names{display:flex;flex-direction:row;gap:1vw;width:100%}
#setup .players .names>label{flex:1;min-width:0}
#setup .players .slot{display:flex;flex-direction:row;align-items:center}
#setup .players .slot input{flex:1;min-width:0}
#setup .players .slot .x{align-self:stretch}
#setup .settings .opts{display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:1.5vw}

@media(max-width:1050px){#setup .setup-layout{grid-template-columns:1fr;grid-template-rows:1.05fr 1fr .65fr}#setup .players .names{flex-direction:row}#setup .players .slot{flex-direction:row}}
@media(max-height:650px){#setup .setup-layout{grid-template-rows:1fr 1fr .6fr}#setup .material #paraBtn{min-height:5vh}}

/* v6: visual polish only — preserve the three horizontal rows and game logic */
#setup{background:radial-gradient(ellipse at 18% 0%,rgba(53,103,165,.24),transparent 45%),radial-gradient(ellipse at 92% 85%,rgba(30,132,138,.12),transparent 45%),var(--bg);font-family:"Segoe UI",Arial,sans-serif}
#setup .setup-head{padding:0 .3vw 0 .7vw;min-height:6vh}
#setup h1{font-weight:900;letter-spacing:.035em;color:var(--text);text-shadow:0 3px 16px rgba(0,0,0,.18)}
#setup .setup-panel{position:relative;background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 86%,var(--panel2)));border:1px solid var(--line);border-radius:19px;padding:1vh 1.45vw;gap:.8vh;box-shadow:0 8px 24px rgba(0,0,0,.13),inset 0 1px rgba(255,255,255,.035)}
#setup .setup-panel:before{content:"";position:absolute;left:0;top:17%;bottom:17%;width:4px;border-radius:0 5px 5px 0;background:#e9b45b}
#setup .players:before{background:#50b5ce}#setup .settings:before{background:#8e9dea}
#setup .panel-label{color:var(--text);font-size:clamp(14px,1.15vw,21px);letter-spacing:.015em;font-weight:850}
#setup .seg{background:var(--top);border:1px solid var(--line);padding:4px;border-radius:13px}
#setup .seg button{border-radius:9px;transition:background .15s,color .15s;font-weight:750}
#setup .seg button.on{background:#3374c8;box-shadow:0 2px 8px rgba(15,50,110,.32)}
#setup select,#setup input:not([type=checkbox]),#setup .pbtn{background:var(--panel2);color:var(--text);border:1.5px solid var(--line);border-radius:12px;outline-offset:2px}
#setup select{padding:.8vh .9vw;min-height:4.6vh}
#setup #paraBtn{background:linear-gradient(120deg,#25517c,#246878);border:1.5px solid #4c9db4;color:#fff;font-weight:800;padding:1vh 1.2vw;box-shadow:inset 0 1px rgba(255,255,255,.15)}
#setup .hint{font-weight:600}
#setup .names>label{padding:.3vh .65vw .5vh;border-radius:12px;background:rgba(255,255,255,.035);font-weight:800}
#setup .names>label:nth-child(1){border-top:3px solid var(--p1)}
#setup .names>label:nth-child(2){border-top:3px solid var(--p2)}
#setup .names>label:nth-child(3){border-top:3px solid var(--p3)}
#setup .slot input{border:2px solid var(--c)!important;background:var(--top)!important;color:var(--text)!important;font-size:clamp(16px,1.4vw,27px);font-weight:800;min-height:5vh}
#setup .slot .x{background:#693044;color:#ffdce5;border:1px solid #9c5064;border-radius:10px;font-weight:850;min-width:3vw}
#setup .settings .opts label{font-weight:700;color:var(--text)}
#setup input[type=checkbox]{accent-color:#4da8e7}
#setup .setup-actions{gap:1.5vw;padding:.2vh .25vw}
#setup #startBtn{background:linear-gradient(180deg,#2eaa80,#17775c);box-shadow:0 5px 0 #0d5340,0 9px 20px rgba(0,0,0,.2);border:1px solid #56d4ab;border-radius:15px;font-weight:900;letter-spacing:.025em}
#setup #startBtn:active{box-shadow:0 1px 0 #0d5340;transform:translateY(4px)}
#setup .setup-tools .small{background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-weight:700;color:var(--muted)}
#setup button:focus-visible,#setup select:focus-visible,#setup input:focus-visible{outline:3px solid #e9bd67;outline-offset:2px}
#mPara .box{background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.4)}
#mPara .para-search input{background:var(--panel2);color:var(--text);border:2px solid var(--line)}
#mPara .grid.paras button{border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left;transition:background .12s,border-color .12s}
#mPara .grid.paras button:hover{border-color:#6fb8d4;background:var(--chip)}
/* v9: several paragraphs at once */
#mPara .grid.paras button i{flex:none;width:1.5em;height:1.5em;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:900;color:transparent;background:var(--bg)}

#mPara .row{flex:none}
#mPara #paraDone{font-weight:850;min-width:12em}

#mPara .hint{flex:none}

#setup .slot .x{background:#c62828;color:#fff;border:1px solid #e35d5d;border-radius:10px;font-weight:900;min-width:3vw}

#setup .fmt{display:flex;gap:.8vw;flex-wrap:wrap;align-items:flex-end}

/* v8: one top bar on setup — title left, plate centre, language + icons right */
#appT{font-size:clamp(18px,2vw,36px);font-weight:900;letter-spacing:.03em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}

/* v10: bottom offset for the board menu (as in «Селфи!»): --safe = % of screen height */
:root{--safe:8}
#app{padding-bottom:calc(var(--safe)*1vh)}

 background:repeating-linear-gradient(45deg,rgba(255,40,80,.6) 0 14px,rgba(255,40,80,.3) 14px 28px);color:#fff;font-weight:900;font-size:clamp(13px,1.3vw,20px);text-shadow:0 2px 4px rgba(0,0,0,.6);border-top:3px dashed #fff}

/* v12: row 03 — every control: caption on top, box below, all boxes on one bottom line */
#setup .settings .opts{flex-wrap:nowrap;align-items:flex-end;gap:1.4vw;width:100%}
#setup .settings .fmt{flex-wrap:nowrap;align-items:flex-end;gap:.9vw}
#setup .settings label.cap,#setup .settings .fmt label{display:flex;flex-direction:column;align-items:center;gap:.4vh;font-size:clamp(12px,.95vw,17px);font-weight:700;color:var(--muted)}
#setup .settings label.cap>span{white-space:nowrap}
#setup .settings #tmin,#setup .settings .fmt input,#setup .settings .sum,#setup .settings #autoBtn{height:clamp(34px,4.8vh,52px);min-height:0;box-sizing:border-box}
#setup .settings #tmin{padding:0 .6vw;font-size:clamp(15px,1.25vw,23px);font-weight:800}
#setup .settings .sum{display:flex;align-items:center;justify-content:center;min-width:3.6em;padding:0 .5vw;border-radius:12px;border:1.5px dashed var(--line);font-size:clamp(16px,1.35vw,25px);font-weight:850;color:var(--text);align-self:auto}
#setup .settings #autoBtn{padding:0 1vw;display:flex;align-items:center}
#setup .settings input.sum{width:3.6em;text-align:center;border-style:solid;padding:0 .3vw}
#setup .settings label.chk{margin-left:auto;display:flex;align-items:center;gap:.6vw;height:clamp(34px,4.8vh,52px);max-width:30vw;line-height:1.2}

/* v11: owner plate and note — 'name plate' (shape of the game: 12px corners; engraved look, not a price tag) */
#owner{background:#1b2c47;color:#c9d4e4;border:1.5px solid #c9a24a;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.28);padding:.28em .9em}
